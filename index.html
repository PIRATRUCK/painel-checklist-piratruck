<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Checklist de Veículos — Piratruck</title>
<style>
:root{
  --bg:#0f172a; --bg2:#111827; --panel:#ffffff; --panel-soft:#f8fafc;
  --border:#e2e8f0; --text:#1e293b; --text-soft:#64748b;
  --brand:#1d4ed8; --brand-dark:#1e3a8a; --brand-soft:#dbeafe;
  --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2;
  --warn:#d97706; --warn-soft:#fef3c7; --na:#64748b; --na-soft:#e2e8f0;
  --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  --shadow-lg:0 10px 25px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--panel-soft); color:var(--text); font-size:14.5px; line-height:1.45;
}
h1,h2,h3,h4{margin:0 0 8px 0; font-weight:700; color:#0f172a}
a{color:var(--brand)}
button{font-family:inherit; cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}

/* ===== Header ===== */
#app-header{
  background:linear-gradient(135deg,var(--brand-dark),var(--brand));
  color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:50; box-shadow:var(--shadow-lg);
  flex-wrap:wrap;
}
#app-header .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px}
#app-header .brand .logo{
  width:34px;height:34px;border-radius:9px;background:#fff;color:var(--brand-dark);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;
}
#app-header .sub{font-size:11.5px; opacity:.85; font-weight:500}
#status-badge{
  margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px;
  background:rgba(255,255,255,.12); padding:6px 12px; border-radius:20px; font-weight:600;
}
#status-badge .dot{width:9px;height:9px;border-radius:50%}
.dot-red{background:#f87171; box-shadow:0 0 0 3px rgba(248,113,113,.3)}
.dot-green{background:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,.35)}
.user-chip{
  background:rgba(255,255,255,.12); padding:6px 12px; border-radius:20px; font-size:12.5px;
  display:flex; align-items:center; gap:6px; font-weight:600;
}
.user-chip input{
  background:transparent;border:none;color:#fff;font-weight:600;font-size:12.5px;width:120px;
  outline:none;
}
.user-chip input::placeholder{color:rgba(255,255,255,.7)}

/* ===== Tabs ===== */
#tab-nav{
  display:flex; gap:4px; background:#0b1220; padding:0 14px; overflow-x:auto;
  position:sticky; top:64px; z-index:40; box-shadow:0 2px 6px rgba(0,0,0,.15);
}
#tab-nav button{
  background:transparent; border:none; color:#94a3b8; padding:13px 16px; font-size:13.5px;
  font-weight:600; border-bottom:3px solid transparent; white-space:nowrap; transition:.15s;
}
#tab-nav button:hover{color:#fff}
#tab-nav button.active{color:#fff; border-bottom-color:#60a5fa}

main{max-width:1180px; margin:0 auto; padding:20px 16px 80px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===== Cards / sections ===== */
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);
}
.card h2{font-size:17px; display:flex; align-items:center; gap:8px}
.card h2 .badge{
  font-size:11px; background:var(--brand-soft); color:var(--brand-dark); padding:3px 9px;
  border-radius:20px; font-weight:700;
}
.section-title{
  font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-soft);
  font-weight:800; margin:22px 0 10px; padding-top:14px; border-top:1px dashed var(--border);
}
.section-title:first-of-type{border-top:none; margin-top:4px; padding-top:0}
.hint{color:var(--text-soft); font-size:12.5px; margin-top:4px}

/* ===== Form grid ===== */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px 14px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:640px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}
.field{display:flex; flex-direction:column; gap:5px}
.field.span-2{grid-column:span 2}
.field.span-3{grid-column:span 3}
.field.full{grid-column:1/-1}
@media(max-width:640px){.field.span-2,.field.span-3{grid-column:span 1}}
label{font-size:12.5px; font-weight:700; color:#334155}
label .req{color:var(--bad); margin-left:2px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],
input[type=tel],input[type=password],select,textarea{
  border:1.5px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13.5px;
  font-family:inherit; background:#fff; color:var(--text); width:100%; transition:.12s;
}
textarea{resize:vertical; min-height:64px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
input.err,select.err,textarea.err{border-color:var(--bad); background:var(--bad-soft)}
.err-msg{color:var(--bad); font-size:11.5px; font-weight:600; display:none}
.err-msg.show{display:block}
.radio-row{display:flex; gap:14px; flex-wrap:wrap; padding-top:4px}
.radio-row label{display:flex; align-items:center; gap:6px; font-weight:600; cursor:pointer}
.radio-row input{width:auto}

/* ===== Buttons ===== */
.btn{
  border:1.5px solid var(--border); background:#fff; color:var(--text); padding:9px 16px;
  border-radius:8px; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px;
  transition:.12s;
}
.btn:hover{background:#f1f5f9}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-danger{background:#fff; border-color:var(--bad); color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-ghost{border-color:transparent; background:transparent}
.btn-ghost:hover{background:#f1f5f9}
.btn-sm{padding:6px 11px; font-size:12px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}

/* ===== Checklist table ===== */
.checklist-table{width:100%; border-collapse:collapse; margin-top:6px}
.checklist-table th{
  text-align:left; font-size:11px; text-transform:uppercase; color:var(--text-soft);
  padding:6px 8px; border-bottom:2px solid var(--border);
}
.checklist-table td{padding:9px 8px; border-bottom:1px solid #f1f5f9; vertical-align:top}
.checklist-table tr:hover{background:#fafcff}
.checklist-item-name{font-size:13px; font-weight:600; max-width:340px}
.status-group{display:flex; gap:4px}
.status-btn{
  border:1.5px solid var(--border); background:#fff; padding:5px 10px; border-radius:7px;
  font-size:11.5px; font-weight:800; color:var(--text-soft); min-width:44px;
}
.status-btn.ok.sel{background:var(--ok); border-color:var(--ok); color:#fff}
.status-btn.bad.sel{background:var(--bad); border-color:var(--bad); color:#fff}
.status-btn.na.sel{background:var(--na); border-color:var(--na); color:#fff}
.checklist-obs{min-width:170px}
.checklist-obs input{padding:6px 8px; font-size:12.5px}
.checklist-progress{
  font-size:12px; font-weight:700; color:var(--text-soft); margin:6px 0 2px;
}

/* ===== Photos ===== */
.photo-drop{
  border:2px dashed var(--border); border-radius:10px; padding:16px; text-align:center;
  background:#fafcff; cursor:pointer; transition:.12s;
}
.photo-drop:hover{border-color:var(--brand); background:var(--brand-soft)}
.photo-drop input{display:none}
.photo-grid{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
.photo-thumb{position:relative; width:96px; height:96px; border-radius:8px; overflow:hidden; border:1px solid var(--border)}
.photo-thumb img{width:100%; height:100%; object-fit:cover; display:block}
.photo-thumb .rm{
  position:absolute; top:3px; right:3px; background:rgba(15,23,42,.75); color:#fff; border:none;
  width:20px; height:20px; border-radius:50%; font-size:12px; line-height:1;
}
.photo-thumb .cap{
  position:absolute; bottom:0; left:0; right:0; background:rgba(15,23,42,.65); color:#fff;
  font-size:9px; padding:2px 4px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ===== Alerts / banners ===== */
.banner{
  border-radius:10px; padding:12px 16px; font-size:13px; font-weight:600; margin-bottom:16px;
  display:flex; gap:10px; align-items:flex-start;
}
.banner-warn{background:var(--warn-soft); color:#92400e; border:1px solid #fde68a}
.banner-ok{background:var(--ok-soft); color:#14532d; border:1px solid #86efac}
.banner-info{background:var(--brand-soft); color:var(--brand-dark); border:1px solid #bfdbfe}
.banner-danger{background:var(--bad-soft); color:#7f1d1d; border:1px solid #fecaca}

/* ===== Vehicle type picker ===== */
.type-picker{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:6px}
.type-card{
  border:1.5px solid var(--border); border-radius:9px; padding:10px 12px; cursor:pointer;
  font-size:12.5px; font-weight:700; text-align:center; background:#fff; transition:.12s;
}
.type-card:hover{border-color:var(--brand); background:var(--brand-soft)}
.type-card.sel{background:var(--brand); border-color:var(--brand); color:#fff}

/* ===== History list ===== */
.day-group{margin-bottom:22px}
.day-heading{
  display:flex; align-items:center; gap:10px; font-weight:800; font-size:14px; color:var(--brand-dark);
  margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid var(--border);
}
.day-heading .count{
  background:var(--brand-soft); color:var(--brand-dark); font-size:11px; padding:2px 9px; border-radius:20px;
}
.record-card{
  border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:9px; background:#fff;
  display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; cursor:pointer;
  transition:.12s;
}
.record-card:hover{border-color:var(--brand); box-shadow:var(--shadow)}
.record-card .rc-main{display:flex; flex-direction:column; gap:3px}
.record-card .rc-tag{
  font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
  padding:2px 8px; border-radius:20px; display:inline-block; width:fit-content;
}
.tag-compra{background:#dbeafe; color:#1e40af}
.tag-manutencao{background:#fef3c7; color:#92400e}
.tag-empresa{background:#dcfce7; color:#166534}
.tag-prevenda{background:#ede9fe; color:#5b21b6}
.record-card .rc-title{font-weight:700; font-size:13.5px}
.record-card .rc-sub{font-size:11.5px; color:var(--text-soft)}
.record-card .rc-status{font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px}
.status-aberto{background:var(--warn-soft); color:#92400e}
.status-concluido{background:var(--ok-soft); color:#166534}
.filters-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.filters-bar .field{min-width:150px; flex:1}
.empty-state{text-align:center; padding:50px 20px; color:var(--text-soft)}
.empty-state .big{font-size:38px; margin-bottom:8px}

/* ===== Modal ===== */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:100;
  align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:#fff; border-radius:14px; max-width:760px; width:100%; box-shadow:var(--shadow-lg);
  animation:pop .12s ease-out;
}
@keyframes pop{from{transform:scale(.97); opacity:0} to{transform:scale(1); opacity:1}}
.modal-head{
  display:flex; justify-content:space-between; align-items:center; padding:16px 20px;
  border-bottom:1px solid var(--border); position:sticky; top:0; background:#fff; border-radius:14px 14px 0 0;
}
.modal-head h3{margin:0; font-size:16px}
.modal-close{background:none; border:none; font-size:22px; color:var(--text-soft); line-height:1}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

.detail-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px 16px; margin-bottom:14px}
.detail-item .k{font-size:10.5px; text-transform:uppercase; color:var(--text-soft); font-weight:800}
.detail-item .v{font-size:13.5px; font-weight:600; margin-top:2px}
.timeline{border-left:2px solid var(--border); padding-left:16px; margin-left:6px}
.timeline-entry{position:relative; padding-bottom:16px}
.timeline-entry::before{content:''; position:absolute; left:-21px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--brand)}
.timeline-entry .te-head{font-size:12.5px; font-weight:800}
.timeline-entry .te-date{font-size:11px; color:var(--text-soft); font-weight:600}
.timeline-entry .te-body{font-size:13px; margin-top:3px; white-space:pre-wrap}

/* ===== Settings ===== */
.code-block{
  background:#0f172a; color:#e2e8f0; padding:14px 16px; border-radius:8px; font-size:12px;
  overflow-x:auto; font-family:Consolas,Menlo,monospace; line-height:1.6;
}
.steps{padding-left:20px; font-size:13px}
.steps li{margin-bottom:8px}
.link-box{
  display:flex; gap:8px; align-items:center; background:var(--panel-soft); border:1px solid var(--border);
  border-radius:8px; padding:8px 10px; margin-top:8px;
}
.link-box input{border:none; background:transparent; font-size:12px; color:var(--text-soft); flex:1}

/* ===== Print ===== */
#print-area{display:none}
@media print{
  #app-header,#tab-nav,.no-print,.modal-overlay .modal-foot{display:none !important}
  body *{visibility:hidden}
  #print-area, #print-area *{visibility:visible}
  #print-area{display:block !important; position:absolute; left:0; top:0; width:100%}
  .print-page{page-break-after:always; padding:14px}
  .print-page:last-child{page-break-after:auto}
}
.print-page{font-family:Arial,sans-serif; color:#111}
.print-page h1{font-size:18px; border-bottom:2px solid #111; padding-bottom:6px; margin-bottom:10px}
.print-page table{width:100%; border-collapse:collapse; font-size:11.5px; margin:8px 0}
.print-page table th,.print-page table td{border:1px solid #94a3b8; padding:4px 6px; text-align:left}
.print-meta{display:grid; grid-template-columns:repeat(3,1fr); gap:4px 14px; font-size:12px; margin-bottom:10px}
.print-meta div b{display:block; font-size:9.5px; color:#555; text-transform:uppercase}
.print-photos{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.print-photos img{width:110px; height:110px; object-fit:cover; border:1px solid #999}
.sig-row{display:flex; justify-content:space-between; margin-top:34px}
.sig-row div{width:45%; text-align:center; border-top:1px solid #111; padding-top:4px; font-size:11px}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px}
.toast{background:#0f172a; color:#fff; padding:11px 16px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); animation:pop .15s}
.toast.err{background:#7f1d1d}
.toast.ok{background:#14532d}

</style>
</head>
<body>

<header id="app-header">
  <div class="brand"><div class="logo">P</div> Painel de Checklist de Veículos <span class="sub">PIRATRUCK</span></div>
  <div id="status-badge"><span class="dot dot-red" id="status-dot"></span><span id="status-text">Modo local (temporário)</span></div>
  <div class="user-chip">👤 <input id="current-user-input" placeholder="Seu nome..."></div>
</header>

<nav id="tab-nav">
  <button class="active" data-tab="compra">🚗 Compra</button>
  <button data-tab="manutencao">🔧 Manutenção</button>
  <button data-tab="empresa">🚚 Veículos da Empresa</button>
  <button data-tab="prevenda">✅ Manutenção Pré-venda</button>
  <button data-tab="historico">📜 Histórico</button>
  <button data-tab="config">⚙️ Configuração</button>
</nav>

<main>
  <div class="tab-panel active" id="panel-compra"></div>
  <div class="tab-panel" id="panel-manutencao"></div>
  <div class="tab-panel" id="panel-empresa"></div>
  <div class="tab-panel" id="panel-prevenda"></div>
  <div class="tab-panel" id="panel-historico"></div>
  <div class="tab-panel" id="panel-config"></div>
</main>

<!-- Modal genérico -->
<div class="modal-overlay no-print" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-box" id="modal-content"></div>
</div>

<!-- Assistente Claude embutido -->
<button class="no-print" id="chat-fab" onclick="toggleChatPanel()" title="Falar com o assistente Claude"
  style="position:fixed; bottom:22px; right:22px; z-index:150; width:56px; height:56px; border-radius:50%;
  background:linear-gradient(135deg,#1e3a8a,#1d4ed8); color:#fff; border:none; font-size:24px; box-shadow:0 6px 18px rgba(15,23,42,.3);">💬</button>

<div class="no-print" id="chat-panel"
  style="position:fixed; bottom:88px; right:22px; z-index:150; width:340px; max-width:92vw; height:440px; max-height:70vh;
  background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(15,23,42,.25); display:none; flex-direction:column; overflow:hidden; border:1px solid #e2e8f0;">
  <div style="background:linear-gradient(135deg,#1e3a8a,#1d4ed8); color:#fff; padding:12px 14px; font-weight:800; font-size:13.5px; display:flex; justify-content:space-between; align-items:center">
    🤖 Assistente Claude — dúvidas do painel
    <button onclick="toggleChatPanel()" style="background:none;border:none;color:#fff;font-size:18px">✕</button>
  </div>
  <div id="chat-messages" style="flex:1; overflow-y:auto; padding:12px; font-size:13px; display:flex; flex-direction:column; gap:8px"></div>
  <div style="display:flex; gap:6px; padding:10px; border-top:1px solid #e2e8f0">
    <textarea id="chat-input" placeholder="Pergunte algo..." rows="1" onkeydown="chatInputKeydown(event)" style="flex:1; resize:none; border:1.5px solid #e2e8f0; border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit"></textarea>
    <button class="btn btn-primary btn-sm" onclick="sendChatMessage()">➤</button>
  </div>
</div>
<style>
  #chat-panel.open{ display:flex !important; }
  .chat-msg{ padding:8px 10px; border-radius:8px; max-width:90%; }
  .chat-msg.user{ background:#dbeafe; align-self:flex-end; }
  .chat-msg.bot{ background:#f1f5f9; align-self:flex-start; }
</style>

<div class="toast-wrap no-print" id="toast-wrap"></div>
<div id="print-area"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

/* Parser tolerante do firebaseConfig (aceita objeto JS ou JSON, sem quebrar valores com ":") */
function parseFirebaseConfigText(raw){
  raw = String(raw || "").trim();
  const m = raw.replace(/^[\s\S]*?(\{[\s\S]*\})[\s\S]*$/, "$1");
  try{ return JSON.parse(m); }catch(e){}
  try{ return (new Function("return (" + m + ")"))(); }catch(e){}
  return null;
}

/* Tela de login simples da equipe (barreira de acesso) */
function piratruckLoginGate(){
  try{ if(sessionStorage.getItem("pt_auth") === "1") return; }catch(e){}
  const ov = document.createElement("div");

/* ================= Utilidades ================= */
function pad(n){ return String(n).padStart(2,"0"); }
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowLocalISO(){ const d = new Date(); return todayISO()+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtDateBR(iso){
  if(!iso) return "—";
  const parts = String(iso).slice(0,10).split("-");
  if(parts.length!==3) return iso;
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}
function fmtDateTimeBR(iso){
  if(!iso) return "—";
  const [d,t] = String(iso).split("T");
  return fmtDateBR(d) + (t? " "+t.slice(0,5) : "");
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function uid(){ return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9); }
function byId(id){ return document.getElementById(id); }
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

function showToast(msg, type){
  const wrap = byId("toast-wrap");
  const t = document.createElement("div");
  t.className = "toast" + (type==="err"?" err":type==="ok"?" ok":"");
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 4200);
}

/* ================= Modal genérico ================= */
function openModal(html, widthClass){
  const overlay = byId("modal-overlay");
  byId("modal-content").innerHTML = html;
  overlay.classList.add("open");
}
function closeModal(){
  byId("modal-overlay").classList.remove("open");
  byId("modal-content").innerHTML = "";
}

/* ================= Componentes de formulário (helpers) ================= */
function fieldWrap(labelText, required, innerHtml, spanClass, errId, hint){
  return '<div class="field '+(spanClass||"")+'">'
    + '<label>'+labelText+(required?'<span class="req">*</span>':'')+'</label>'
    + innerHtml
    + (hint? '<div class="hint">'+hint+'</div>' : '')
    + (errId? '<div class="err-msg" id="'+errId+'">Campo obrigatório.</div>' : '')
    + '</div>';
}
function textInput(id, opts){
  opts = opts||{};
  return '<input type="'+(opts.type||"text")+'" id="'+id+'" placeholder="'+escapeAttr(opts.placeholder||"")+'" value="'+escapeAttr(opts.value||"")+'"'+(opts.step?' step="'+opts.step+'"':'')+'>';
}
function textareaInput(id, opts){
  opts = opts||{};
  return '<textarea id="'+id+'" placeholder="'+escapeAttr(opts.placeholder||"")+'">'+escapeHtml(opts.value||"")+'</textarea>';
}
function selectInput(id, options, opts){
  opts = opts||{};
  return '<select id="'+id+'"><option value="">-- selecione --</option>'
    + options.map(o=>'<option value="'+escapeAttr(o)+'" '+(o===opts.value?"selected":"")+'>'+escapeHtml(o)+'</option>').join("")
    + '</select>';
}
function radioGroup(name, options, opts){
  opts = opts||{};
  return '<div class="radio-row" id="'+name+'" data-radiogroup="1">'
    + options.map(o=>'<label><input type="radio" name="'+name+'" value="'+escapeAttr(o)+'" '+(o===opts.value?"checked":"")+' onclick="onRadioChange(\''+name+'\')"> '+escapeHtml(o)+'</label>').join("")
    + '</div>';
}
function getRadioValue(name){
  const el = qs('input[name="'+name+'"]:checked');
  return el ? el.value : "";
}
function onRadioChange(name){
  const el = byId(name);
  if(el) el.classList.remove("err");
  const errEl = byId(name+"_err");
  if(errEl) errEl.classList.remove("show");
  // re-render conditional sections if a hook exists
  const hook = window["onRadio_"+name];
  if(typeof hook === "function") hook(getRadioValue(name));
}

/* ---- Seletor de tipo de veículo/implemento ---- */
function vehicleTypePicker(id, selectedKey){
  const cards = Object.keys(VEHICLE_TYPES).map(function(k){
    const v = VEHICLE_TYPES[k];
    return '<div class="type-card '+(k===selectedKey?"sel":"")+'" data-key="'+k+'" onclick="selectVehicleType(\''+id+'\', this)">'+escapeHtml(v.label)+'</div>';
  }).join("");
  return '<div class="type-picker" id="'+id+'" data-value="'+(selectedKey||"")+'">'+cards+'</div>';
}
function selectVehicleType(pickerId, el){
  const picker = byId(pickerId);
  qsa(".type-card", picker).forEach(c=>c.classList.remove("sel"));
  el.classList.add("sel");
  picker.dataset.value = el.dataset.key;
  picker.classList.remove("err");
  const hook = window["onTypeChange_"+pickerId];
  if(typeof hook === "function") hook(el.dataset.key);
}
function getVehicleTypeValue(pickerId){
  const el = byId(pickerId);
  return el ? (el.dataset.value||"") : "";
}

/* ---- Tabela de checklist dinâmica ---- */
function checklistTable(id, items, existingValues){
  checklistState[id] = (items||[]).map(function(it, i){
    const ex = existingValues && existingValues[i];
    return { item: it, status: ex? ex.status : null, obs: ex? (ex.obs||"") : "" };
  });
  return renderChecklistBody(id);
}
function renderChecklistBody(id){
  const items = checklistState[id];
  if(!items || !items.length){
    return '<p class="hint" id="'+id+'_wrap">Selecione o tipo de veículo/implemento acima para carregar os itens do checklist físico e documental.</p>';
  }
  const rows = items.map(function(row, i){
    return '<tr data-idx="'+i+'">'
      + '<td class="checklist-item-name">'+escapeHtml(row.item)+'</td>'
      + '<td><div class="status-group">'
        + '<button type="button" class="status-btn ok '+(row.status==="OK"?"sel":"")+'" onclick="setChecklistStatus(\''+id+'\','+i+',\'OK\')">OK</button>'
        + '<button type="button" class="status-btn bad '+(row.status==="NÃO"?"sel":"")+'" onclick="setChecklistStatus(\''+id+'\','+i+',\'NÃO\')">NÃO</button>'
        + '<button type="button" class="status-btn na '+(row.status==="N/A"?"sel":"")+'" onclick="setChecklistStatus(\''+id+'\','+i+',\'N/A\')">N/A</button>'
        + '</div></td>'
      + '<td class="checklist-obs"><input type="text" placeholder="Observação'+(row.status==="NÃO"?" (obrigatória)":"")+'" id="'+id+'_obs_'+i+'" value="'+escapeAttr(row.obs)+'" onchange="setChecklistObs(\''+id+'\','+i+',this.value)"></td>'
      + '</tr>';
  }).join("");
  const done = items.filter(r=>r.status).length;
  return '<div id="'+id+'_wrap">'
    + '<div class="checklist-progress" id="'+id+'_progress">'+done+'/'+items.length+' itens avaliados'+(done<items.length? ' — <span style="color:#dc2626">faltam '+(items.length-done)+'</span>':' ✅')+'</div>'
    + '<table class="checklist-table" id="'+id+'"><thead><tr><th style="width:44%">Item verificado</th><th style="width:26%">Status</th><th>Observação</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + '</div>';
}
function setChecklistStatus(id, idx, status){
  checklistState[id][idx].status = status;
  const table = byId(id);
  const row = table ? table.querySelector('tr[data-idx="'+idx+'"]') : null;
  if(row){
    qsa(".status-btn", row).forEach(function(b){ b.classList.remove("sel"); });
    const cls = status==="OK" ? "ok" : status==="NÃO" ? "bad" : "na";
    const btn = row.querySelector(".status-btn."+cls);
    if(btn) btn.classList.add("sel");
    const obsInput = byId(id+"_obs_"+idx);
    if(obsInput){
      obsInput.placeholder = "Observação" + (status==="NÃO" ? " (obrigatória)" : "");
      if(status!=="NÃO") obsInput.classList.remove("err");
    }
  }
  updateChecklistProgress(id);
}
function updateChecklistProgress(id){
  const items = checklistState[id];
  if(!items) return;
  const done = items.filter(function(r){ return r.status; }).length;
  const prog = byId(id+"_progress");
  if(prog) prog.innerHTML = done+"/"+items.length+" itens avaliados"+(done<items.length? ' — <span style="color:#dc2626">faltam '+(items.length-done)+'</span>':' ✅');
}
function setChecklistObs(id, idx, val){
  checklistState[id][idx].obs = val;
}
function reloadChecklistFor(id, typeKey){
  const t = VEHICLE_TYPES[typeKey];
  const items = t ? t.items : [];
  const wrap = byId(id+"_wrap");
  const html = checklistTable(id, items);
  if(wrap) wrap.outerHTML = html;
}
function validateChecklist(id, errBoxId){
  const items = checklistState[id];
  const errBox = byId(errBoxId);
  if(!items || !items.length){
    if(errBox){ errBox.textContent = "Selecione o tipo de veículo e preencha todos os itens do checklist."; errBox.classList.add("show"); }
    return false;
  }
  let ok = true;
  items.forEach(function(row, i){
    const obsInput = byId(id+"_obs_"+i);
    if(!row.status){ ok = false; }
    if(row.status==="NÃO" && !row.obs.trim()){ ok=false; if(obsInput) obsInput.classList.add("err"); }
    else if(obsInput){ obsInput.classList.remove("err"); }
  });
  if(errBox){
    if(!ok){ errBox.textContent = "Marque um status (OK/NÃO/N-A) para TODOS os itens. Itens marcados como NÃO precisam de observação."; errBox.classList.add("show"); }
    else { errBox.classList.remove("show"); }
  }
  return ok;
}
function checklistSummary(items){
  const c = { OK:0, "NÃO":0, "N/A":0 };
  (items||[]).forEach(r=>{ if(r.status) c[r.status] = (c[r.status]||0)+1; });
  return c;
}

function photoUploader(id, minCount, existing){
  photoState[id] = existing ? existing.slice() : (photoState[id]||[]);

    + '<button type="button" style="flex:1;min-width:150px;padding:12px;border:1.5px solid #16a34a;background:#16a34a;color:#fff;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer" onclick="openCamera(\''+id+'\')">📷 Tirar foto (câmera)</button>'
    + '<button type="button" style="flex:1;min-width:150px;padding:12px;border:1.5px solid #cbd5e1;background:#f8fafc;color:#334155;border-radius:8px;font-size:14px;cursor:pointer" onclick="byId(\''+id+'_input\').click()">🖼️ Carregar do dispositivo</button>'
    + '<input type="file" id="'+id+'_input" accept="image/*" multiple style="display:none" onchange="handlePhotoInput(\''+id+'\', this.files)">'
    + '</div>'
    + (minCount?'<div style="font-size:12px;color:#64748b;margin-bottom:6px">Mínimo '+minCount+' foto(s).</div>':'')
    + '<div class="photo-grid" id="'+id+'_grid">'+renderPhotoGrid(id)+'</div>'
    + '<div class="err-msg" id="'+id+'_err">Adicione ao menos '+minCount+' foto(s).</div>';
}
function renderPhotoGrid(id){
  return (photoState[id]||[]).map(function(p, i){
    return '<div class="photo-thumb"><img src="'+p.dataUrl+'"><button type="button" class="rm" onclick="removePhoto(\''+id+'\','+i+')">✕</button><div class="cap">'+escapeHtml(p.name)+'</div></div>';
  }).join("");
}
function handlePhotoInput(id, fileList){
  const files = Array.from(fileList||[]);
  let pending = files.length;
  if(!pending) return;
  files.forEach(function(file){
    compressImage(file, 900, 0.62).then(function(dataUrl){
      photoState[id] = photoState[id]||[];
      photoState[id].push({ name: file.name, dataUrl: dataUrl });
      const grid = byId(id+"_grid");
      if(grid) grid.innerHTML = renderPhotoGrid(id);
      const err = byId(id+"_err");
      if(err) err.classList.remove("show");
    }).catch(function(){ showToast("Não foi possível carregar uma das fotos.","err"); });
  });
}
function removePhoto(id, idx){
  photoState[id].splice(idx,1);
  byId(id+"_grid").innerHTML = renderPhotoGrid(id);
}
/* ===== Câmera ao vivo dentro do sistema (assistente PIRATRUCK) ===== */
var _camId=null,_camStream=null,_camFacing="environment";
function openCamera(id){
  _camId=id;
  var ov=document.getElementById("cam-overlay");
  if(!ov){
    ov=document.createElement("div"); ov.id="cam-overlay";
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center";
    ov.innerHTML='<video id="cam-video" autoplay playsinline muted style="max-width:96vw;max-height:72vh;border-radius:10px;background:#000"></video>'
      +'<div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'
      +'<button type="button" onclick="capturePhoto()" style="padding:13px 24px;font-size:16px;font-weight:bold;background:#16a34a;color:#fff;border:none;border-radius:10px;cursor:pointer">📸 Capturar</button>'
      +'<button type="button" onclick="flipCamera()" style="padding:13px 18px;font-size:15px;background:#334155;color:#fff;border:none;border-radius:10px;cursor:pointer">🔄 Virar câmera</button>'
      +'<button type="button" onclick="closeCamera()" style="padding:13px 18px;font-size:15px;background:#dc2626;color:#fff;border:none;border-radius:10px;cursor:pointer">✕ Fechar</button>'
      +'</div><canvas id="cam-canvas" style="display:none"></canvas>';
    document.body.appendChild(ov);
  }
  ov.style.display="flex";
  startCam();
}
function startCam(){
  stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showToast("Câmera não suportada neste navegador.","err"); closeCamera(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:_camFacing},audio:false}).then(function(s){
    _camStream=s; var v=document.getElementById("cam-video"); if(v){ v.srcObject=s; }
  }).catch(function(){ showToast("Não consegui abrir a câmera. Verifique a permissão do navegador.","err"); closeCamera(); });
}
function flipCamera(){ _camFacing=(_camFacing==="environment")?"user":"environment"; startCam(); }
function stopCam(){ if(_camStream){ _camStream.getTracks().forEach(function(t){ t.stop(); }); _camStream=null; } }
function closeCamera(){ stopCam(); var ov=document.getElementById("cam-overlay"); if(ov) ov.style.display="none"; _camId=null; }
function capturePhoto(){
  var v=document.getElementById("cam-video");
  if(!v||!v.videoWidth){ showToast("Aguarde a câmera carregar.","err"); return; }
  var c=document.getElementById("cam-canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  var id=_camId;
  var finish=function(file){ handlePhotoInput(id,[file]); showToast("Foto capturada ✓","ok"); };
  if(c.toBlob){ c.toBlob(function(b){ finish(new File([b],"foto_"+Date.now()+".jpg",{type:"image/jpeg"})); },"image/jpeg",0.9); }
  else { var d=c.toDataURL("image/jpeg",0.9); var bin=atob(d.split(",")[1]); var arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); finish(new File([arr],"foto_"+Date.now()+".jpg",{type:"image/jpeg"})); }
}
function compressImage(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e){
      const img = new Image();
      img.onerror = reject;
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function validatePhotos(id, min, errId){
  const n = (photoState[id]||[]).length;
  const ok = n >= min;
  const err = byId(errId || (id+"_err"));
  if(err) err.classList.toggle("show", !ok);
  return ok;
}

function requireRadio(name){
  const ok = !!getRadioValue(name);
  const el = byId(name);
  if(el) el.classList.toggle("err", !ok);
  const errEl = byId(name+"_err");
  if(errEl) errEl.classList.toggle("show", !ok);
  return ok;
}
function requireVehicleType(pickerId){
  const ok = !!getVehicleTypeValue(pickerId);
  const el = byId(pickerId);
  if(el) el.classList.toggle("err", !ok);
  const errEl = byId(pickerId+"_err");
  if(errEl) errEl.classList.toggle("show", !ok);
  return ok;
}
function requireOneOf(ids){
  const ok = ids.some(function(id){ const el = byId(id); return el && el.value.trim(); });
  ids.forEach(function(id){ const el = byId(id); if(el) el.classList.toggle("err", !ok); });
  return ok;
}

function saveEmpresaDevolucao(recordId){
  const id = "empresadev";
  const r = state.records.find(x=>x.id===recordId);
  let ok = true;
  ok = requireText(id+"_operador") && ok;
  ok = requireText(id+"_dataretorno") && ok;
  ok = requireText(id+"_kmchegada") && ok;
  ok = requireText(id+"_combchegada") && ok;
  ok = requireRadio(id+"_abasteceuchegada") && ok;
  if(getRadioValue(id+"_abasteceuchegada")==="Sim"){ ok = requireText(id+"_valorabast") && ok; }
  ok = requireText(id+"_obs") && ok;
  ok = validatePhotos(id+"_fotos", 1) && ok;
  const kmChegada = parseFloat(byId(id+"_kmchegada").value);
  const kmSaida = parseFloat(r.kmSaida);
  if(!isNaN(kmChegada) && !isNaN(kmSaida) && kmChegada < kmSaida){
    byId(id+"_kmchegada").classList.add("err");
    showToast("O KM de chegada não pode ser menor que o KM de saída ("+kmSaida+").","err");
    ok = false;
  }
  if(!ok){ if(byId(id+"_kmchegada").classList.contains("err")===false) showToast("Preencha todos os campos obrigatórios destacados em vermelho.","err"); return; }

  const now = nowLocalISO();
  const operador = byId(id+"_operador").value.trim();
  r.dataRetorno = byId(id+"_dataretorno").value;
  r.kmChegada = byId(id+"_kmchegada").value.trim();
  r.kmRodado = (kmChegada - kmSaida);
  r.combustivelChegada = byId(id+"_combchegada").value;
  r.abasteceuChegada = getRadioValue(id+"_abasteceuchegada");
  r.valorAbastChegada = byId(id+"_valorabast").value.trim();
  r.obsRetorno = byId(id+"_obs").value.trim();
  r.fotosChegada = photoState[id+"_fotos"];
  r.status = "concluido";
  r.atualizadoEm = now;
  r.atualizadoPor = operador;
  r.historico.push({ data: now, autor: operador, acao: "Devolução registrada.", detalhes: "KM chegada: "+r.kmChegada+" (rodou "+r.kmRodado+" km) | Abasteceu: "+r.abasteceuChegada });
  persistRecord(r, true).then(function(){
    showToast("Devolução registrada!","ok");
    closeModal();
    renderHistorico();
  });
}

/* ================= Persistência (Firestore online OU memória local) ================= */
function persistRecord(record, isUpdate){
  return new Promise(function(resolve, reject){
    if(fbDb){
      const col = fbDb.collection("checklist_veiculos");
      const p = (isUpdate && record.id) ? col.doc(record.id).set(record, {merge:true}) : col.add(record).then(function(ref){ record.id = ref.id; });
      p.then(function(){
        if(!isUpdate){ /* onSnapshot cuidará de popular state.records */ }
        resolve();
      }).catch(function(err){ showToast("Erro ao salvar online: "+err.message,"err"); reject(err); });
    } else {
      if(!record.id) record.id = uid();
      const idx = state.records.findIndex(function(r){ return r.id===record.id; });
      if(idx>=0) state.records[idx] = record; else state.records.unshift(record);
      resolve();
    }
  });
}
function deleteRecord(recordId){
  if(!confirm("Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.")) return;
  if(fbDb){
    fbDb.collection("checklist_veiculos").doc(recordId).delete().then(function(){
      showToast("Registro excluído.","ok");
      closeModal();
    }).catch(function(err){ showToast("Erro ao excluir: "+err.message,"err"); });
  } else {
    state.records = state.records.filter(function(r){ return r.id!==recordId; });
    showToast("Registro excluído.","ok");
    closeModal();
    renderHistorico();
  }
}

/* ================= HISTÓRICO ================= */
function recordPrimaryDate(r){
  const d = r.dataCheck || r.dataChegada || (r.dataSaida && r.tag!=="empresa" ? r.dataSaida : null) || (r.dataSaida ? String(r.dataSaida).slice(0,10) : null) || r.dataInicio || (r.criadoEm ? String(r.criadoEm).slice(0,10) : todayISO());
  return String(d).slice(0,10);
}
function recordTitle(r){
  if(r.tag==="empresa") return (r.placa||"—") + " · " + (r.modelo||"");
  return (r.placa || r.chassi || "—") + " · " + (r.tipoVeiculoLabel||"") ;
}
function recordStatusLabel(r){
  if(r.tag==="manutencao") return r.status==="aberto" ? "Em manutenção" : "Concluído";
  if(r.tag==="empresa") return r.status==="em_uso" ? "Em uso" : "Devolvido";
  return "Concluído";
}
function renderSettings(){
  // placeholder called at boot; actual content set in HTML + wireSettings()
}
function getHistoricoFilters(){
  return {
    tag: byId("f-tag") ? byId("f-tag").value : "",
    tipo: byId("f-tipo") ? byId("f-tipo").value : "",
    busca: byId("f-busca") ? byId("f-busca").value.trim().toLowerCase() : "",
    de: byId("f-de") ? byId("f-de").value : "",
    ate: byId("f-ate") ? byId("f-ate").value : "",
    operador: byId("f-operador") ? byId("f-operador").value.trim().toLowerCase() : ""
  };
}
function matchesFilters(r, f){
  if(f.tag && r.tag!==f.tag) return false;
  if(f.tipo && r.tipoVeiculo!==f.tipo) return false;
  const day = recordPrimaryDate(r);
  if(f.de && day < f.de) return false;
  if(f.ate && day > f.ate) return false;
  if(f.operador && !(String(r.criadoPor||"").toLowerCase().includes(f.operador))) return false;
  if(f.busca){
    const hay = [r.placa, r.chassi, r.marca, r.modelo, r.cliente, r.motorista, r.criadoPor].join(" ").toLowerCase();
    if(!hay.includes(f.busca)) return false;
  }
  return true;
}
function renderHistoricoFiltersBar(){
  const typeOptions = Object.keys(VEHICLE_TYPES).map(function(k){ return '<option value="'+k+'">'+escapeHtml(VEHICLE_TYPES[k].label)+'</option>'; }).join("");
  return '<div class="card"><div class="filters-bar">'
    + '<div class="field"><label>Categoria</label><select id="f-tag" onchange="renderHistorico()"><option value="">Todas</option>'
      + '<option value="compra">Compra de Veículo</option><option value="manutencao">Manutenção</option>'
      + '<option value="empresa">Veículo da Empresa</option><option value="prevenda">Manutenção Pré-venda</option></select></div>'
    + '<div class="field"><label>Tipo de veículo</label><select id="f-tipo" onchange="renderHistorico()"><option value="">Todos</option>'+typeOptions+'</select></div>'

function clearHistoricoFilters(){
  ["f-tag","f-tipo","f-de","f-ate","f-operador","f-busca"].forEach(function(id){ if(byId(id)) byId(id).value=""; });
  renderHistorico();
}
function renderHistorico(){
  const panel = byId("panel-historico");
  const scrollBox = byId("historico-list");
  const filtersHtml = renderHistoricoFiltersBar();
  const topBar = '<div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px">'
    + '<div><b>'+state.records.length+'</b> registro(s) no total. '+(fbDb? '🟢 sincronizado online.' : '🔴 modo local — use os botões abaixo para não perder dados.')+'</div>'
    + '<div style="display:flex; gap:8px; flex-wrap:wrap">'
      + '<button class="btn btn-sm" onclick="exportJson()">⬇️ Exportar backup (.json)</button>'
      + '<button class="btn btn-sm" onclick="byId(\'import-json-input\').click()">⬆️ Importar backup (.json)</button>'
      + '<input type="file" id="import-json-input" accept="application/json" style="display:none" onchange="importJsonFile(this.files[0])">'
    + '</div></div>';

  const f = getHistoricoFilters();
  const recs = state.records.filter(function(r){ return matchesFilters(r, f); });

  let listHtml;
  if(!recs.length){
    listHtml = '<div class="empty-state"><div class="big">🗂️</div><p>Nenhum registro encontrado'+(state.records.length? ' com esses filtros.' : ' ainda. Preencha um checklist em alguma das abas.')+'</p></div>';
  } else {
    const groups = {};
    recs.forEach(function(r){ const d = recordPrimaryDate(r); (groups[d]=groups[d]||[]).push(r); });
    const days = Object.keys(groups).sort().reverse();
    listHtml = days.map(function(d){
      const items = groups[d].sort(function(a,b){ return String(b.criadoEm||"").localeCompare(String(a.criadoEm||"")); });
      return '<div class="day-group">'
        + '<div class="day-heading">📅 '+fmtDateBR(d)+' <span class="count">'+items.length+' registro(s)</span>'
        + '<button class="btn btn-sm no-print" style="margin-left:auto" onclick="exportDayPdf(\''+d+'\')">🖨️ Exportar PDF do dia</button></div>'
        + items.map(recordCardHtml).join("")
        + '</div>';
    }).join("");
  }
  if(panel){
    panel.innerHTML = filtersHtml + topBar + '<div id="historico-list"></div>';
    byId("historico-list").innerHTML = listHtml;
    // restore filter values (they got wiped by innerHTML replace of filtersHtml above, so re-apply)
  }
}

    extra += '<p><b>Serviço</b> ('+fmtDateBR(r.dataInicio)+' a '+fmtDateBR(r.dataConclusao)+') | Oficina: '+escapeHtml(r.oficina||"")+' | Custo: R$ '+escapeHtml(r.custoTotal||"")+'</p>';
    extra += '<p>Serviços realizados: '+escapeHtml(r.servicosRealizados||"")+' | Peças trocadas: '+escapeHtml(r.pecasTrocadas||"")+'</p>';
    extra += '<p><b>Aprovado para venda:</b> '+escapeHtml(r.aprovadoVenda||"")+(r.motivoReprova? " — "+escapeHtml(r.motivoReprova):"")+'</p>';
    extra += '<table><thead><tr><th>Item</th><th>Status</th><th>Obs.</th></tr></thead><tbody>'+clRows(r.checklist)+'</tbody></table>';
    extra += photos(r.fotosAntes, "Fotos ANTES"); extra += photos(r.fotosDepois, "Fotos DEPOIS");
  }
  const hist = (r.historico||[]).map(function(h){ return '<li>'+fmtDateTimeBR(h.data)+' — <b>'+escapeHtml(h.autor)+'</b>: '+escapeHtml(h.acao)+(h.detalhes? " ("+h.detalhes+")":"")+'</li>'; }).join("");

  return '<div class="print-page"><h1>PIRATRUCK — '+TAG_LABEL[r.tag]+' — '+escapeHtml(recordTitle(r))+'</h1>'
    + meta + extra
    + '<p><b>Histórico de atualizações:</b></p><ul>'+hist+'</ul>'
    + '</div>';
}
function printRecordById(recordId){
  const r = state.records.find(function(x){ return x.id===recordId; });
  if(!r) return;
  byId("print-area").innerHTML = buildPrintPage(r);
  setTimeout(function(){ window.print(); }, 60);
}
function exportDayPdf(day){
  const f = getHistoricoFilters();
  const recs = state.records.filter(function(r){ return recordPrimaryDate(r)===day && matchesFilters(r,f); });
  byId("print-area").innerHTML = recs.map(buildPrintPage).join("");
  setTimeout(function(){ window.print(); }, 60);
}

/* ================= Export / Import JSON (backup manual) ================= */
function exportJson(){
  const blob = new Blob([JSON.stringify({ records: state.records, exportadoEm: nowLocalISO() }, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "checklist-veiculos-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); a.remove();
}
function importJsonFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const list = Array.isArray(data.records) ? data.records : Array.isArray(data) ? data : null;
      if(!list) throw new Error("formato inválido");
      let added=0, updated=0;
      list.forEach(function(r){
        const idx = state.records.findIndex(function(x){ return x.id===r.id; });
        if(idx>=0){ state.records[idx]=r; updated++; } else { state.records.push(r); added++; }
      });
      renderHistorico();
      showToast("Importado: "+added+" novo(s), "+updated+" atualizado(s).","ok");
    }catch(err){ showToast("Arquivo inválido para importação.","err"); }
  };
  reader.readAsText(file);
}

/* ================= FIREBASE (sincronização online entre aparelhos) ================= */
function loadFirebaseConfigFromUrl(){
  const h = location.hash || "";
  const m = h.match(/cfg=([^&]+)/);
  if(m){
    try{
      const json = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
      const cfg = JSON.parse(json);
      connectFirebase(cfg, true);
    }catch(e){ console.warn("Config Firebase na URL inválida", e); }
  }
}
function setOnlineStatus(on){
  state.online = on;
  const dot = byId("status-dot");
  const txt = byId("status-text");
  if(dot) dot.className = "dot " + (on ? "dot-green" : "dot-red");
  if(txt) txt.textContent = on ? "Online — sincronizado" : "Modo local (temporário)";
}
function connectFirebase(cfg, silent){
  if(typeof firebase === "undefined"){
    showToast("Não foi possível carregar a biblioteca do Firebase (verifique a internet).","err");
    return;
  }
  try{
    if(fbApp){ try{ fbApp.delete(); }catch(e){} }
    fbApp = firebase.initializeApp(cfg, "piratruck-"+Date.now());
    fbDb = fbApp.firestore();
    if(fbUnsub) fbUnsub();
    fbUnsub = fbDb.collection("checklist_veiculos").onSnapshot(function(snap){
      state.records = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      setOnlineStatus(true);
      renderHistorico();
    }, function(err){
      showToast("Erro de conexão com o Firebase: "+err.message,"err");
      setOnlineStatus(false);
    });
    state.fbConfig = cfg;
    const encoded = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))));
    const newUrl = location.pathname + location.search + "#cfg=" + encoded;
    history.replaceState(null, "", newUrl);
    const linkInput = byId("share-link-input");
    if(linkInput) linkInput.value = location.href;
    if(!silent) showToast("Conectado ao Firebase! Copie/salve o link para acessar já conectado da próxima vez.","ok");
    renderSettingsContent();
  }catch(e){
    showToast("Erro ao conectar: "+e.message,"err");
  }
}
function disconnectFirebase(){
  if(fbUnsub) fbUnsub();
  fbUnsub = null; fbDb = null; fbApp = null; state.fbConfig = null;
  history.replaceState(null, "", location.pathname + location.search);
  setOnlineStatus(false);
  showToast("Desconectado. Voltando ao modo local.","ok");
  renderSettingsContent();
  renderHistorico();
}
function copyShareLink(){
  const input = byId("share-link-input");
  if(!input || !input.value){ showToast("Conecte-se ao Firebase primeiro.","err"); return; }
  input.select();
  try{ document.execCommand("copy"); showToast("Link copiado!","ok"); }
  catch(e){ navigator.clipboard && navigator.clipboard.writeText(input.value).then(function(){ showToast("Link copiado!","ok"); }); }
}
function handleFirebaseConnectForm(){
  const raw = byId("fb-config-input").value.trim();
  if(!raw){ showToast("Cole a configuração do Firebase (firebaseConfig).","err"); return; }
  let cfg = parseFirebaseConfigText(raw);
  if(!cfg){
    showToast("Não consegui interpretar a configuração colada. Cole exatamente o objeto firebaseConfig.","err");
    return;
  }
  if(!cfg.apiKey || !cfg.projectId){ showToast("Configuração incompleta — faltam campos (apiKey/projectId).","err"); return; }
  connectFirebase(cfg, false);
}

/* ================= Assistente Claude embutido (chat de ajuda) ================= */
const APP_SYSTEM_PROMPT = "Você é um assistente dentro do 'Painel de Checklist de Veículos' da Piratruck. "
  + "O painel tem 4 abas de preenchimento: (1) Compra de Veículos — checklist documental e físico com fotos, tipo de veículo escolhido carrega os itens certos; "
  + "(2) Manutenção — registra entrada do veículo na oficina com checklist, depois no Histórico dá pra 'Registrar saída da manutenção' pra completar o mesmo registro; "
  + "(3) Veículos da Empresa — registra retirada (motorista, km saída, combustível) e depois devolução (km chegada, se abasteceu) no mesmo registro; "
  + "(4) Manutenção Pré-venda — serviços feitos em veículos seminovos antes de vender, com checklist final e fotos antes/depois. "
  + "Também há a aba Histórico (filtra por data, tipo, operador, e exporta PDF por dia ou por registro) e Configuração (conectar sincronização online via Firebase, e configurar esta própria IA). "
  + "Todo checklist só salva quando TODOS os campos obrigatórios estiverem preenchidos (em vermelho quando faltam). "
  + "Cada registro guarda quem preencheu e data; é possível 'Adicionar informação' depois sem apagar o que já foi salvo. "
  + "Responda em português do Brasil, de forma direta e prática, ajudando o usuário a usar o painel ou entender os campos. "
  + "Você NÃO consegue alterar o código do painel em tempo real (ele é um arquivo estático) — se o usuário pedir uma mudança de verdade na ferramenta, oriente-o a pedir o ajuste na conversa original com o Claude que criou o painel.";

let chatHistory = [];
function toggleChatPanel(){
  const panel = byId("chat-panel");
  panel.classList.toggle("open");
}
function renderChatMessages(){
  const box = byId("chat-messages");
  box.innerHTML = chatHistory.map(function(m){
    const who = m.role==="user" ? "Você" : "Claude";
    const cls = m.role==="user" ? "chat-msg user" : "chat-msg bot";
    return '<div class="'+cls+'"><b>'+who+':</b> '+escapeHtml(m.content).replace(/\n/g,"<br>")+'</div>';
  }).join("") || '<p class="hint">Pergunte algo sobre como usar o painel — ex: "como registro a saída de manutenção?"</p>';
  box.scrollTop = box.scrollHeight;
}
async function sendChatMessage(){
  const input = byId("chat-input");
  const text = input.value.trim();
  if(!text) return;
  if(!state.claudeApiKey){
    showToast("Configure sua chave de API do Claude em Configuração primeiro.","err");
    switchTab("config");
    toggleChatPanel();
    return;
  }
  chatHistory.push({ role:"user", content:text });
  input.value = "";
  renderChatMessages();
  const thinkingMsg = { role:"assistant", content:"…pensando" };
  chatHistory.push(thinkingMsg);
  renderChatMessages();
  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": state.claudeApiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: state.claudeModel || "claude-sonnet-4-5",
        max_tokens: 700,
        system: APP_SYSTEM_PROMPT,
        messages: chatHistory.filter(function(m){ return m!==thinkingMsg; }).map(function(m){ return { role: m.role==="user"?"user":"assistant", content: m.content }; })
      })
    });
    const data = await resp.json();
    chatHistory.pop();
    if(!resp.ok){
      chatHistory.push({ role:"assistant", content:"Erro: "+(data.error && data.error.message ? data.error.message : resp.statusText) });
    } else {
      const textOut = (data.content||[]).map(function(c){ return c.text||""; }).join("");
      chatHistory.push({ role:"assistant", content: textOut || "(sem resposta)" });
    }
  }catch(e){
    chatHistory.pop();
    chatHistory.push({ role:"assistant", content:"Não consegui falar com a API (verifique internet/chave). Detalhe: "+e.message });
  }
  renderChatMessages();
}
function chatInputKeydown(ev){
  if(ev.key==="Enter" && !ev.shiftKey){ ev.preventDefault(); sendChatMessage(); }
}
